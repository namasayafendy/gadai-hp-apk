    if (!gl) return null;
    var ext = gl.getExtension('WEBGL_debug_renderer_info');

  // rAF tidak jalan bila halaman ter-background → fallback timeout 3 dtk = null (jujur tak terukur)
  return new Promise(function (res) {
    var selesai = false;
    function done(v) { if (!selesai) { selesai = true; res(v); } }
    setTimeout(function () { done(null); }, 3000);
    var frames = 0, t0 = null;
    function tick(t) {
      if (t0 === null) t0 = t;
      frames++;
      if (t - t0 < 1500) requestAnimationFrame(tick);
      else done(Math.round(frames / ((t - t0) / 1000)));

    try { requestAnimationFrame(tick); } catch (e) { done(null); }
  });

function catat(key, status, note, evidence, mulai, suspicious) {
  S.guidedTests[key] = status;

  S.guidedEvidence[key] = {
    status: status, evidence: evidence || '',
    suspicious: !!suspicious,
    duration_sec: mulai ? Math.round((Date.now() - mulai) / 1000) : null
  };
}
// Tombol kebal preventDefault induk (overlay tes): respons di touchend — yang TETAP jalan
// walau ancestor men-preventDefault touchstart (penyebab tap "ditelan" di iOS Safari) —
// + fallback click utk desktop. Sekali-tembak (fired guard) supaya tidak dobel.
function tapBind(btn, fn) {
  var fired = false;
  function go(e) { if (fired) return; fired = true; if (e && e.cancelable) e.preventDefault(); fn(); }
  btn.addEventListener('touchend', go);
  btn.addEventListener('click', go);
}
function pilihDariDaftar(judul, daftar, cb) {
  var html = '<div class="card"><b>' + judul + '</b><br><br>';
  for (var i = 0; i < daftar.length; i++) html += '<button class="btn sec" data-i="' + i + '">' + daftar[i] + '</button>';
  html += '</div>';
  var c = el(html); show(c);
  var btns = c.querySelectorAll('button');
  for (var j = 0; j < btns.length; j++) (function (b) { tapBind(b, function () { cb(daftar[+b.getAttribute('data-i')]); }); })(btns[j]);
}
function verdictBar(key, onDone) {

    '<button class="btn vd-ok" style="background:var(--hijau)">✓ BAGUS</button>' +

    '<button class="btn sec vd-skip">Lewati tes ini</button></div>');
  tapBind(c.querySelector('.vd-ok'), function () { onDone('BAGUS', null); });
  tapBind(c.querySelector('.vd-bad'), function () { pilihDariDaftar('Apa kerusakannya?', RUSAK_PRESET[key] || ['rusak'], function (s) { onDone('RUSAK', s); }); });
  tapBind(c.querySelector('.vd-skip'), function () { pilihDariDaftar('Alasan dilewati?', LEWATI_PRESET, function (s) { onDone('DILEWATI', s); }); });

}

// ---- 2. Touchscreen matrix + multitouch + ghost ----
function tesTouch(next) {
  var mulai = Date.now();
  var ov = el('<div style="position:fixed;inset:0;z-index:99;background:#222;touch-action:none" id="ov">' +
    '<canvas id="cv" style="position:absolute;inset:0"></canvas>' +
    '<div id="lbl" style="position:absolute;top:16px;left:12px;right:12px;background:rgba(0,0,0,.7);color:#fff;padding:8px;border-radius:8px;font-size:13px;text-align:center;pointer-events:none"></div>' +
    '<div id="act" style="position:absolute;bottom:14px;left:12px;right:12px;display:none">' +
      '<button class="btn" id="selesai">SELESAI — BERI NILAI</button></div></div>');
  document.body.appendChild(ov);
  var cv = ov.querySelector('#cv'), lbl = ov.querySelector('#lbl');
  cv.width = innerWidth; cv.height = innerHeight;
  var g = cv.getContext('2d');
  var cell = 40, cols = Math.ceil(innerWidth / cell), rows = Math.ceil(innerHeight / cell);
  var painted = {}, total = cols * rows, count = 0, maxTouch = 0;
  g.fillStyle = '#333';
  for (var r = 0; r < rows; r++) for (var cc = 0; cc < cols; cc++) g.fillRect(cc*cell+1, r*cell+1, cell-2, cell-2);
  function mark(x, y) {
    var cx = Math.floor(x / cell), cy = Math.floor(y / cell), k = cy * cols + cx;
    if (!painted[k]) { painted[k] = 1; count++; g.fillStyle = '#1b8f3a'; g.fillRect(cx*cell+1, cy*cell+1, cell-2, cell-2); upd(); }
  }
  function pct() { return Math.round(count * 100 / total); }
  function upd() {
    lbl.textContent = 'USAP SELURUH LAYAR (' + pct() + '%) • sesekali 3-5 jari (multi-touch: ' + maxTouch + ')';
    if (pct() >= 60) ov.querySelector('#act').style.display = 'block';
  }
  function onT(e) {
    if (e.cancelable) e.preventDefault();
    if (e.touches && e.touches.length > maxTouch) maxTouch = e.touches.length;
    var ts = e.touches || [];
    for (var i = 0; i < ts.length; i++) mark(ts[i].clientX, ts[i].clientY);
    if (e.clientX !== undefined) mark(e.clientX, e.clientY); // mouse utk uji desktop
  }
  // PENTING: listener swipe di KANVAS saja (bukan ov) → tombol SELESAI (sibling) tetap bisa di-tap.
  cv.addEventListener('touchstart', onT, {passive:false});
  cv.addEventListener('touchmove', onT, {passive:false});
  cv.addEventListener('mousedown', function (e) { onT(e); });
  cv.addEventListener('mousemove', function (e) { if (e.buttons) onT(e); });
  upd();
  tapBind(ov.querySelector('#selesai'), function () {
    // KELUAR overlay dulu, lalu nilai sbg kartu normal (#app) — preset RUSAK/Lewati tampil benar.
    document.body.removeChild(ov);
    S.pwaIdentity.max_multitouch_points = maxTouch || null;
    var card = el('<div><div class="card center"><b>TES SENTUH selesai</b>' +
      '<p class="muted">' + pct() + '% area terusap • multi-touch ' + maxTouch + ' titik. Beri penilaian:</p></div></div>');
    card.appendChild(verdictBar('touchscreen', function (st, note) {
      catat('touchscreen', st, note, pct() + '% area terusap, ' + maxTouch + ' titik multi-touch', mulai, st === 'BAGUS' && pct() < 85);
      tesGhost(next);
    }));
    show(card);
  });
}
function tesGhost(next) {
  var detik = 10, events = 0;
  var ov = el('<div style="position:fixed;inset:0;z-index:99;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px" id="ov"><div><h2>TES GHOST TOUCH</h2><p id="t" style="font-size:40px;margin:8px">10</p><p>LETAKKAN ' + namaPerangkat().toUpperCase() + ', JANGAN DISENTUH</p><p id="e" class="warn"></p></div></div>');
  document.body.appendChild(ov);
  function onT(e) { e.preventDefault(); events++; ov.querySelector('#e').textContent = 'Sentuhan terdeteksi: ' + events; }

}

// ---- 4. Audio: loopback objektif + rekam-putar ----
function goertzel(buf, rate, freq) {
  var k = Math.round(buf.length * freq / rate), w = 2 * Math.PI * k / buf.length, c = 2 * Math.cos(w);
  var s0, s1 = 0, s2 = 0;
  for (var i = 0; i < buf.length; i++) { s0 = buf[i] + c * s1 - s2; s2 = s1; s1 = s0; }
  return (s1 * s1 + s2 * s2 - c * s1 * s2) / buf.length;
}
function tesAudio(next) {
  var mulai = Date.now();
  var c = el('<div><div class="card center"><b>TES SPEAKER + MIC (otomatis)</b>' +
    '<p class="muted">Nada akan dibunyikan dan mic ikut mendengarkan (bukti otomatis). Izinkan akses mikrofon bila diminta.</p>' +
    '<button class="btn" id="go">▶ MAINKAN NADA & DETEKSI</button><div id="hasil"></div></div><div id="vb"></div></div>');
  show(c);
  var det = null, rms = null;
  c.querySelector('#go').onclick = function () {
    c.querySelector('#hasil').innerHTML = '<div class="spin"></div>';
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
      var AC = window.AudioContext || window.webkitAudioContext;
      var ctx = new AC();
      var osc = ctx.createOscillator(); osc.frequency.value = 1000;
      var gain = ctx.createGain(); gain.gain.value = 0.6;
      osc.connect(gain); gain.connect(ctx.destination);
      var src = ctx.createMediaStreamSource(stream);
      var proc = ctx.createScriptProcessor(4096, 1, 1);
      var samples = [];
      proc.onaudioprocess = function (ev) {
        var d = ev.inputBuffer.getChannelData(0);
        for (var i = 0; i < d.length; i += 4) samples.push(d[i]);
      };
      src.connect(proc); proc.connect(ctx.destination);
      osc.start();
      setTimeout(function () {
        osc.stop(); proc.disconnect(); src.disconnect();
        stream.getTracks().forEach(function (t) { t.stop(); });
        var buf = new Float32Array(samples.slice(0, 30000));
        var sum = 0; for (var i = 0; i < buf.length; i++) sum += buf[i] * buf[i];
        rms = buf.length ? Math.sqrt(sum / buf.length) : 0;
        var p1k = goertzel(buf, ctx.sampleRate / 4, 1000);
        var pref = goertzel(buf, ctx.sampleRate / 4, 1500);
        det = buf.length > 0 && rms > 0.003 && p1k > pref * 6;
        ctx.close();
        c.querySelector('#hasil').innerHTML = det
          ? '<div class="alert green">🟢 Nada TERDETEKSI mic — speaker & mic bekerja</div>'
          : '<div class="alert yellow">🟡 Nada tidak terdeteksi (speaker mati / mic mati / izin ditolak / berisik) — nilai dgn telinga</div>';
      }, 1800);
    }).catch(function (e) {
      det = null;
      c.querySelector('#hasil').innerHTML = '<div class="alert yellow">🟡 Mic tidak bisa diakses (' + e.name + ') — nilai dgn telinga</div>';
    });
  };
  c.querySelector('#vb').appendChild(verdictBar('loudspeaker', function (st, note) {
    catat('loudspeaker', st, note, det === null ? 'loopback tidak jalan' : ('loopback 1kHz ' + (det ? 'TERDETEKSI' : 'tidak terdeteksi') + ' (rms ' + (rms !== null ? rms.toFixed(4) : '-') + ')'), mulai, st === 'BAGUS' && det !== true);
    catat('mic', st === 'BAGUS' && det === true ? 'BAGUS' : st, st !== 'BAGUS' ? note : null, det === true ? 'terbukti via loopback' : 'mengikuti verdict speaker', mulai, det !== true);
    next();

}

// ---- 5. Kamera depan & belakang ----
function tesKamera(facing, key, judul, next) {
  var mulai = Date.now();
  var c = el('<div><div class="card center"><b>' + judul + '</b><br><br>' +
    '<video id="v" autoplay playsinline style="width:100%;border-radius:10px;background:#000;min-height:200px"></video>' +
    '<div id="hasil"></div></div><div id="vb"></div></div>');
  show(c);
  var jalan = false;
  navigator.mediaDevices.getUserMedia({ video: { facingMode: facing } }).then(function (stream) {
    c.querySelector('#v').srcObject = stream; jalan = true;
    c._stream = stream;
  }).catch(function (e) {
    c.querySelector('#hasil').innerHTML = '<div class="alert yellow">🟡 Kamera tidak bisa dibuka (' + e.name + ')</div>';
  });
  c.querySelector('#vb').appendChild(verdictBar(key, function (st, note) {
    if (c._stream) c._stream.getTracks().forEach(function (t) { t.stop(); });
    catat(key, st, note, jalan ? 'preview tampil' : 'preview GAGAL', mulai, st === 'BAGUS' && !jalan);
    next();
  }));
}

// ---- 6. Sensor gerak (DeviceMotion, perlu izin iOS) ----
function tesMotion(next) {
  var mulai = Date.now();
  var c = el('<div><div class="card center"><b>TES SENSOR GERAK</b>' +
    '<p>Goyang & putar ' + namaPerangkat() + ' beberapa kali.</p><p id="st" class="muted">Menunggu izin sensor…</p></div><div id="vb"></div></div>');
  show(c);
  var maxAcc = 0, pasang = function () {
    window.addEventListener('devicemotion', function (e) {
      var a = e.accelerationIncludingGravity || e.acceleration;
      if (!a) return;
      var m = Math.sqrt((a.x||0)*(a.x||0) + (a.y||0)*(a.y||0) + (a.z||0)*(a.z||0));
      if (m > maxAcc) maxAcc = m;
      var ok = maxAcc > 18; // diam ~9.8; goyang > 18
      c.querySelector('#st').innerHTML = ok ? '<span class="ok">🟢 Gerak terdeteksi (' + maxAcc.toFixed(1) + ')</span>' : 'terbaca: ' + maxAcc.toFixed(1) + ' — goyang lebih kuat';
    });
  };
  if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
    DeviceMotionEvent.requestPermission().then(function (r) {
      if (r === 'granted') pasang(); else c.querySelector('#st').textContent = 'izin sensor ditolak';
    }).catch(function () { c.querySelector('#st').textContent = 'izin sensor gagal'; });
  } else { pasang(); }
  c.querySelector('#vb').appendChild(verdictBar('motion_sensors', function (st, note) {
    catat('motion_sensors', st, note, 'akselerasi maks ' + maxAcc.toFixed(1), mulai, st === 'BAGUS' && maxAcc < 18);
    next();
  }));
}

function layarTesFisik() {
  var c = el('<div class="card center"><b>TES FISIK (' + '7 langkah)</b>' +

// Item 2 (v0.7): opsi sesuai model → (bila perlu) layar "Part mana?" → simpan {value, lacak, parts}.
// Model tanpa menu (lacak TIDAK) + tombol ⚠️ MENU_ADA: opsi LENGKAP tanpa "tidak ada bagian" → simpan + menu_ada:true
// (relay/tiket: 🟡 Model klaim — cek Model Name). lacak yang disimpan tetap lacak model klaim.
function layarParts(key, judul, krusial, mulai, lanjut) {
  var lacak = lacakParts();
  var menuAda = false;
  // lacak untuk daftar part & part otomatis: menu ditemukan di model "tanpa menu" → model asli tak diketahui → LENGKAP
  function lacakPart() { return menuAda ? 'LENGKAP' : lacak; }
  function simpan(value, parts) {
    var extra = { lacak: lacak, parts: parts };
    if (menuAda) extra.menu_ada = true;
    simpanWizard(key, value, null, mulai, false, extra);
    lanjut();
  }
  function pilihOpsi() {
    var opsi = menuAda ? opsiMenuAda() : opsiParts(lacak);
    var html = '<div><div class="card"><b>' + judul + '</b><p style="font-size:15px">' + (menuAda ? instruksiMenuAda() : instruksiParts(lacak)) + '</p></div><div class="card">';
    for (var o = 0; o < opsi.length; o++) html += '<button class="btn sec op" data-o="' + o + '" style="text-align:left">' + opsi[o][0] + '</button>';
    // Model tanpa menu: tidak ada yang bisa dilewati (LANJUT atau ⚠️ menu ternyata ada)
    if (menuAda) html += '<button class="btn sec" id="balik">← Kembali (ternyata menu tidak ada)</button>';

    html += '</div></div>';

        if (op[1] === MENU_ADA) { menuAda = true; pilihOpsi(); return; }
        // konfirmasi 2-langkah (anti asal-ketuk) — kecuali model tanpa menu: memang tidak ada yang dibuka
        if (krusial && op[1] !== 'TIDAK_DILACAK' && (Date.now() - mulai) < 4000) {
          if (!confirm('Yakin sudah benar-benar membuka menu Settings-nya? (baru ' + Math.round((Date.now()-mulai)/1000) + ' dtk)')) return;
        }
        if (perluCentangPart(lacakPart(), op[1])) pilihPart(op);

    });

    c.querySelector('#balik').onclick = pilihOpsi;

          ? '<p>Buka <b>Settings → Battery → Battery Health</b> → catat <b>Maximum Capacity</b> dan <b>Cycle Count</b> ' +
            '(iPhone 15 ke atas dgn iOS 17.4+: keduanya di halaman yang sama, bersama Manufacture Date & First Use). ' +
            'iOS 17.0–17.3: Cycle Count ada di <b>Settings → General → About</b>.'
          : '<p>Buka <b>Settings → Battery → Battery Health</b> → catat <b>Maximum Capacity</b>.' +
            (cyc === null ? '<br>Cycle Count (bila ada): <b>Settings → Battery → Battery Health</b>, atau <b>Settings → General → About</b>.' : '')) +
        (isIpad() ? '<br><span class="warn">Kebanyakan iPad tidak punya menu Battery Health — bila tidak ada, Lewati.</span>' : '') + '</p>' +
        '<input id="bh" type="number" min="1" max="100" style="width:100%;padding:12px;font-size:16px;border:1px solid #ccc;border-radius:10px" placeholder="Battery Health % (mis. 87)">' +
        (tanyaCyc ? '<br><br><input id="cy" type="number" min="0" style="width:100%;padding:12px;font-size:16px;border:1px solid #ccc;border-radius:10px" placeholder="Cycle Count (mis. 412)">' : '') +
        '<button class="btn" id="ok">SIMPAN & LANJUT</button>' +
        '<button class="btn sec" id="skip">Lewati</button></div></div>');
      show(c2);
      c2.querySelector('#ok').onclick = function () {
        var bh = parseInt(c2.querySelector('#bh').value, 10);
        var cyEl = c2.querySelector('#cy');
        var cy = cyEl ? parseInt(cyEl.value, 10) : NaN;
        // v0.7: model yang PASTI menampilkan Cycle Count (iPhone 15+) tapi kolom kosong → tanya sekali (batal = tetap di layar)
        if (cyc === true && isNaN(cy) &&
            !confirm('Cycle Count belum diisi. iPhone 15 ke atas menampilkannya di Settings → Battery → Battery Health. Lanjut tanpa Cycle Count?')) return;
        simpanWizard('battery_health_percent', isNaN(bh) ? null : bh, null, mulai);
        simpanWizard('battery_cycle_count', isNaN(cy) ? null : cy,
          cyc === false ? 'model tidak menampilkan cycle (cek via USB)' : (isNaN(cy) ? 'cycle tidak dicatat' : null), mulai);
        lanjut();
      };
      c2.querySelector('#skip').onclick = function () {
        simpanWizard('battery_health_percent', null, 'dilewati', mulai, true);
        simpanWizard('battery_cycle_count', null, 'dilewati', mulai, true);
        lanjut();
      };
      return;
    }
    if (instr === '_INPUT_STORAGE_') {
      var caps = [32, 64, 128, 256, 512, 1024];
      var html3 = '<div><div class="card"><b>' + judul + '</b><p>Buka <b>Settings → General → About → Capacity</b>:</p>';
      for (var x = 0; x < caps.length; x++) html3 += '<button class="btn sec cap" data-v="' + caps[x] + '">' + (caps[x] >= 1024 ? '1 TB' : caps[x] + ' GB') + '</button>';
      html3 += '<button class="btn sec" id="skip">Lewati</button></div></div>';
      var c3 = el(html3); show(c3);
      c3.querySelectorAll('.cap').forEach(function (b) { b.onclick = function () { simpanWizard(key, parseInt(b.getAttribute('data-v'), 10), null, mulai); lanjut(); }; });
      c3.querySelector('#skip').onclick = function () { simpanWizard(key, null, 'dilewati', mulai, true); lanjut(); };
      return;
    }
    if (instr === '_PARTS_') { layarParts(key, judul, krusial, mulai, lanjut); return; }
    // item pilihan biasa
    var html = '<div><div class="card"><b>' + judul + '</b><p style="font-size:15px">' + instr + '</p></div><div class="card">';
    for (var o = 0; o < opsi.length; o++) html += '<button class="btn sec op" data-o="' + o + '" style="text-align:left">' + opsi[o][0] + '</button>';
    html += '<button class="btn sec" id="skip" style="color:#999">Lewati item ini' + (krusial ? ' (akan 🔴 di laporan!)' : '') + '</button></div></div>';
    var c4 = el(html); show(c4);
    c4.querySelectorAll('.op').forEach(function (b) {
      b.onclick = function () {
        var op = opsi[+b.getAttribute('data-o')];
        // konfirmasi 2-langkah utk item krusial (anti asal-ketuk + bukti durasi)
        if (krusial && (Date.now() - mulai) < 4000) {
          if (!confirm('Yakin sudah benar-benar membuka menu Settings-nya? (baru ' + Math.round((Date.now()-mulai)/1000) + ' dtk)')) return;
        }
        simpanWizard(key, op[1], null, mulai);
        lanjut();
      };
    });
    c4.querySelector('#skip').onclick = function () { simpanWizard(key, null, 'dilewati penaksir', mulai, true); lanjut(); };
  }
  var intro = el('<div class="card center"><b>CEK SETTINGS ' + namaPerangkat().toUpperCase() + ' (10 langkah)</b>' +
    '<p class="muted">Ikuti instruksi tiap langkah di Settings ' + namaPerangkat() + ' ini, lalu pilih hasilnya. ' +
    'Langkah 1–3 & 8 paling penting — bila dilewati akan 🔴 di laporan.</p>' +
    '<button class="btn" id="go">▶ MULAI</button></div>');
  show(intro);
  intro.querySelector('#go').onclick = satu;
}

function layarRingkasan() {
  var n = Object.keys(S.guidedTests).length + Object.keys(S.settingsChecks).length;
  var c = el('<div class="card center"><p class="ok" style="font-size:18px">Semua pemeriksaan selesai (' + n + ' item)</p>' +
    '<p class="muted">Hasil akan dikirim ke HP penaksir. Tidak ada data pribadi yang ikut terkirim.</p>' +
    '<button class="btn" id="kirim">📤 KIRIM HASIL</button></div>');
  show(c);
  c.querySelector('#kirim').onclick = function () { kirimHasil(false); };
}

function kirimHasil(cloneOnly) {
  show(el('<div class="card center"><div class="spin"></div><p>Mengirim hasil…</p></div>'));
  var results = {
    pwa_identity: S.pwaIdentity,
    device_identity: S.deviceIdentity,
    settings_checks: S.settingsChecks,
    guided_tests: S.guidedTests,
    guided_test_notes: S.guidedNotes,
    guided_evidence: S.guidedEvidence
  };
  var coba = 0;
  function kirim() {
    coba++;
    api({ action:'tests', report_id:RID, submit_token:ST, results:results }).then(function (j) {
      if (j.ok) {
        show(el('<div class="card center"><p style="font-size:48px;margin:8px">✅</p>' +
          '<p class="ok" style="font-size:18px">HASIL TERKIRIM</p>' +
          '<p class="muted">Lanjutkan di HP penaksir. Tab ini boleh ditutup — tidak ada data tersimpan di iPhone.</p></div>'));
      } else if (coba < 3) { setTimeout(kirim, 2000); }
      else {
        show(el('<div class="card center"><p class="err">Gagal mengirim: ' + (j.error || '?') + '</p>' +
          '<button class="btn" onclick="location.reload()">ULANGI DARI AWAL</button></div>'));
      }
    }).catch(function () {
      if (coba < 3) setTimeout(kirim, 2000);
      else show(el('<div class="card center"><p class="err">Tidak bisa terhubung. Cek internet lalu coba lagi.</p>' +
        '<button class="btn" id="re">COBA KIRIM LAGI</button></div>'));
    });
  }
  kirim();
}

layarAwal();
</script>
</body>
</html>
